<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A R Investigation Service – Hero v15</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #0f4c5c; }

  .hero {
    position: relative; width: 100%;
    aspect-ratio: 12 / 5; min-height: 440px; overflow: hidden;
    display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; padding: 0 7%;
    background: linear-gradient(180deg, #0f4c5c 0%, #0b3a47 100%); color: #fff;
  }
  .left { position: relative; z-index: 2; }
  .eyebrow { font-size: clamp(11px, 1vw, 14px); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #ffcf70; margin-bottom: 14px; }
  h1 { font-size: clamp(30px, 4.4vw, 64px); line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #ffcf70; }
  .lead { margin-top: 16px; font-size: clamp(14px, 1.45vw, 19px); line-height: 1.65; color: #bcdbe3; max-width: 500px; }
  .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .tags span { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 16px; font-size: clamp(11px, 1.05vw, 14px); font-weight: 700; }

  /* door scene */
  .right { position: relative; z-index: 2; display: flex; justify-content: center; align-items: flex-end; height: 100%; }
  .wall { position: absolute; right: -8%; bottom: 0; width: 120%; height: 94%; background: #e9d8bf; border-radius: 160px 160px 0 0; opacity: .0; }
  .scene { position: relative; width: min(86%, 400px); }
  .scene svg { width: 100%; height: auto; display: block; }
  .bell { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .35; } }
  .bubble {
    position: absolute; top: 6%; left: -22%; background: #fff; color: #0f4c5c; border-radius: 16px 16px 16px 4px;
    padding: 10px 16px; font-weight: 800; font-size: clamp(12px, 1.2vw, 16px); box-shadow: 0 10px 26px rgba(0,0,0,.3);
  }
  .bubble small { display: block; font-weight: 500; font-size: .8em; color: #5d7a85; }

  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; aspect-ratio: auto; padding: 44px 7% 0; }
    .right { height: 380px; }
    .scene { width: 260px; }
    .bubble { left: -4%; top: -2%; }
  }
  @media (prefers-reduced-motion: reduce) { .bell { animation: none; } }
</style>
</head>
<body>
  <section class="hero">
    <div class="left">
      <div class="eyebrow">A R Investigation Service</div>
      <h1>We come to you.<br><span>Right to the door.</span></h1>
      <p class="lead">Verification is done in person, at the actual address, so what you receive is based on what was really there.</p>
      <div class="tags"><span>Residence</span><span>Business</span><span>Address</span></div>
    </div>

    <div class="right" aria-hidden="true">
      <div class="scene">
        <div class="bubble">Verification visit<small>Field executive at the door</small></div>
        <svg viewBox="0 0 400 520">
          <!-- wall -->
          <rect x="0" y="0" width="400" height="520" rx="18" fill="#efe2cb"/>
          <!-- wall texture lines -->
          <g stroke="#e0d0b3" stroke-width="2">
            <line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="130" x2="400" y2="130"/>
            <line x1="0" y1="200" x2="400" y2="200"/>
          </g>
          <!-- door frame -->
          <rect x="70" y="60" width="260" height="460" fill="#8a5a3a"/>
          <rect x="84" y="74" width="232" height="446" fill="#1f7a8c"/>
          <!-- panels -->
          <rect x="108" y="100" width="82" height="150" rx="6" fill="#18697a"/>
          <rect x="210" y="100" width="82" height="150" rx="6" fill="#18697a"/>
          <rect x="108" y="272" width="82" height="200" rx="6" fill="#18697a"/>
          <rect x="210" y="272" width="82" height="200" rx="6" fill="#18697a"/>
          <!-- peephole + handle -->
          <circle cx="200" cy="170" r="8" fill="#ffd9a0"/><circle cx="200" cy="170" r="3" fill="#0b3a47"/>
          <rect x="262" y="290" width="14" height="46" rx="7" fill="#ffd9a0"/>
          <!-- number plate -->
          <rect x="150" y="14" width="100" height="36" rx="8" fill="#fff"/>
          <rect x="164" y="24" width="72" height="8" rx="4" fill="#c7d6dc"/>
          <rect x="178" y="38" width="44" height="5" rx="3" fill="#dfe8eb"/>
          <!-- doorbell -->
          <rect x="344" y="260" width="34" height="56" rx="8" fill="#fff"/>
          <circle class="bell" cx="361" cy="288" r="11" fill="#ffcf70"/>
          <!-- mat -->
          <rect x="108" y="500" width="184" height="16" rx="4" fill="#ffcf70"/>
          <!-- floor -->
          <rect x="0" y="516" width="400" height="4" fill="#cdbb9b"/>
        </svg>
      </div>
    </div>
  </section>
</body>
</html>
