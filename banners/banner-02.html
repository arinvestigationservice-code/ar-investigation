<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A R Investigation Service – Hero</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #0a1a2f; }

  .hero {
    position: relative; width: 100%;
    aspect-ratio: 12 / 5; min-height: 380px;
    overflow: hidden; color: #fff;
    background:
      radial-gradient(ellipse at 78% 50%, rgba(212,168,83,.16), transparent 55%),
      linear-gradient(120deg, #07142a 0%, #0d2a4a 60%, #11365c 100%);
    display: flex; align-items: center;
  }
  /* dotted grid */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.12) 1.4px, transparent 1.6px);
    background-size: 28px 28px;
    -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 60%);
            mask-image: linear-gradient(90deg, transparent 20%, #000 60%);
  }

  .content { position: relative; z-index: 2; padding: 0 7%; max-width: 780px; }
  .brand {
    font-size: clamp(12px, 1.1vw, 15px); letter-spacing: .22em;
    text-transform: uppercase; color: #d4a853; margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand::before { content: ""; width: 36px; height: 2px; background: #d4a853; }
  h1 {
    font-size: clamp(28px, 4.1vw, 60px); line-height: 1.12;
    font-weight: 700; letter-spacing: -.01em; margin-bottom: 16px;
  }
  h1 em { font-style: normal; color: #d4a853; }
  p {
    font-size: clamp(14px, 1.5vw, 20px); line-height: 1.6;
    color: #c9d6e3; max-width: 560px;
  }

  /* coverage pins */
  .map { position: absolute; right: 0; top: 0; width: 55%; height: 100%; z-index: 1; }
  .pin { position: absolute; width: 14px; height: 14px; transform: translate(-50%,-50%); }
  .pin i {
    position: absolute; inset: 0; border-radius: 50%;
    background: #d4a853; box-shadow: 0 0 0 4px rgba(212,168,83,.25);
  }
  .pin b {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 1.5px solid rgba(212,168,83,.7);
    animation: pulse 3s ease-out infinite;
  }
  .pin:nth-child(2n) b { animation-delay: .8s; }
  .pin:nth-child(3n) b { animation-delay: 1.6s; }
  @keyframes pulse {
    0% { transform: scale(.4); opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lines line { stroke: rgba(212,168,83,.28); stroke-width: 1.2; stroke-dasharray: 4 6; }

  @media (max-width: 700px) {
    .hero { aspect-ratio: auto; min-height: 440px; }
    .map { width: 100%; opacity: .45; }
    .content { padding: 0 7%; }
  }
  @media (prefers-reduced-motion: reduce) { .pin b { animation: none; opacity: .5; } }
</style>
</head>
<body>
  <section class="hero">
    <div class="map" aria-hidden="true">
      <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="22" y1="30" x2="48" y2="18"/><line x1="48" y1="18" x2="74" y2="30"/>
        <line x1="22" y1="30" x2="35" y2="58"/><line x1="48" y1="18" x2="58" y2="50"/>
        <line x1="74" y1="30" x2="58" y2="50"/><line x1="35" y1="58" x2="58" y2="50"/>
        <line x1="58" y1="50" x2="82" y2="62"/><line x1="35" y1="58" x2="50" y2="80"/>
        <line x1="58" y1="50" x2="50" y2="80"/><line x1="82" y1="62" x2="70" y2="84"/>
        <line x1="50" y1="80" x2="70" y2="84"/><line x1="74" y1="30" x2="90" y2="40"/>
      </svg>
      <div class="pin" style="left:22%;top:30%"><b></b><i></i></div>
      <div class="pin" style="left:48%;top:18%"><b></b><i></i></div>
      <div class="pin" style="left:74%;top:30%"><b></b><i></i></div>
      <div class="pin" style="left:90%;top:40%"><b></b><i></i></div>
      <div class="pin" style="left:35%;top:58%"><b></b><i></i></div>
      <div class="pin" style="left:58%;top:50%"><b></b><i></i></div>
      <div class="pin" style="left:82%;top:62%"><b></b><i></i></div>
      <div class="pin" style="left:50%;top:80%"><b></b><i></i></div>
      <div class="pin" style="left:70%;top:84%"><b></b><i></i></div>
    </div>

    <div class="content">
      <div class="brand">A R Investigation Service</div>
      <h1>Field verification,<br><em>wherever you need it.</em></h1>
      <p>Residence, business and address verification by our on-ground team, delivered with clear and reliable reports.</p>
    </div>
  </section>
</body>
</html>
