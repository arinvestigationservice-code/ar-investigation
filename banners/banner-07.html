<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A R Investigation Service – Hero v12</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #ffd23f; }

  .hero {
    position: relative; width: 100%;
    aspect-ratio: 12 / 5; min-height: 440px; overflow: hidden;
    display: grid; grid-template-columns: 1.1fr .9fr; align-items: center;
    padding: 0 7%; background: #ffd23f; color: #14202b;
  }
  /* diagonal stripes on right */
  .hero::before {
    content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 46%;
    background: repeating-linear-gradient(135deg, #14202b 0 22px, #1c2c3a 22px 44px);
    clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
  }

  .left { position: relative; z-index: 2; }
  .eyebrow { font-size: clamp(11px, 1vw, 14px); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 14px; }
  h1 { font-size: clamp(30px, 4.5vw, 66px); line-height: 1.04; font-weight: 900; letter-spacing: -.025em; }
  h1 mark { background: #14202b; color: #ffd23f; padding: 0 12px; border-radius: 6px; }
  .lead { margin-top: 18px; font-size: clamp(14px, 1.45vw, 19px); line-height: 1.6; color: #3a3217; max-width: 500px; font-weight: 500; }
  .trust { display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  .trust span { background: #fff; border: 2px solid #14202b; border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: clamp(11px, 1.1vw, 15px); box-shadow: 3px 3px 0 #14202b; }

  /* ID card with lanyard */
  .right { position: relative; z-index: 2; display: flex; justify-content: center; height: 100%; align-items: center; }
  .lanyard {
    position: absolute; top: -10%; left: 50%; width: 46px; height: 46%;
    background: #e63946; transform: translateX(-50%); z-index: 1;
    border-left: 3px solid #b82a36; border-right: 3px solid #b82a36;
  }
  .clip { position: absolute; top: 33%; left: 50%; width: 58px; height: 22px; background: #c9ccd1; border-radius: 6px; transform: translateX(-50%); z-index: 3; box-shadow: 0 3px 6px rgba(0,0,0,.3); }
  .id {
    position: relative; z-index: 2; width: min(56%, 290px); aspect-ratio: 5.4 / 8.4;
    background: #fff; border-radius: 18px; overflow: hidden; margin-top: 16%;
    box-shadow: 0 28px 60px rgba(0,0,0,.45); transform: rotate(3deg);
    display: flex; flex-direction: column; align-items: center;
  }
  .id .band { width: 100%; background: #14202b; color: #ffd23f; text-align: center; padding: 22px 8px 10px; font-weight: 800; font-size: clamp(10px, .95vw, 13px); letter-spacing: .14em; text-transform: uppercase; }
  .id .slot { width: 22px; height: 6px; border-radius: 4px; background: #ffd23f; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
  .avatar { width: 46%; aspect-ratio: 1; border-radius: 50%; background: #e7edf3; margin-top: 16px; position: relative; overflow: hidden; border: 4px solid #ffd23f; }
  .avatar::before { content: ""; position: absolute; left: 50%; top: 22%; width: 38%; height: 38%; border-radius: 50%; background: #9db0c2; transform: translateX(-50%); }
  .avatar::after  { content: ""; position: absolute; left: 50%; top: 58%; width: 80%; height: 70%; border-radius: 50%; background: #9db0c2; transform: translateX(-50%); }
  .id h4 { margin-top: 12px; font-size: clamp(13px, 1.3vw, 18px); font-weight: 900; }
  .id .role { font-size: clamp(10px, .95vw, 13px); color: #5a6b7b; font-weight: 600; margin-top: 2px; }
  .id .lines { width: 70%; margin-top: 14px; }
  .id .lines i { display: block; height: 7px; border-radius: 4px; background: #e7edf3; margin-bottom: 8px; }
  .id .lines i:nth-child(2) { width: 75%; }
  .id .ver { margin-top: auto; width: 100%; background: #17b26a; color: #fff; text-align: center; padding: 10px; font-weight: 900; letter-spacing: .12em; font-size: clamp(10px, 1vw, 13px); }

  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; aspect-ratio: auto; padding: 44px 7% 0; }
    .hero::before { display: none; }
    .right { height: 430px; background: #14202b; margin: 30px -9% 0; }
    .id { margin-top: 0; width: 210px; }
    .lanyard { height: 36%; }
    .clip { top: 21%; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="left">
      <div class="eyebrow">A R Investigation Service</div>
      <h1>Know who is<br>at <mark>your door.</mark></h1>
      <p class="lead">Every visit is made by an authorised field executive carrying an ID, so you can trust the person and the report.</p>
      <div class="trust">
        <span>Residence</span><span>Business</span><span>Address</span>
      </div>
    </div>

    <div class="right" aria-hidden="true">
      <div class="lanyard"></div>
      <div class="clip"></div>
      <div class="id">
        <div class="slot"></div>
        <div class="band">A R Investigation Service</div>
        <div class="avatar"></div>
        <h4>Field Executive</h4>
        <div class="role">Authorised Representative</div>
        <div class="lines"><i></i><i></i></div>
        <div class="ver">✔ VERIFIED</div>
      </div>
    </div>
  </section>
</body>
</html>
